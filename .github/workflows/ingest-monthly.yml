name: ingest — mensal

on:
  schedule:
    - cron: "30 7 13 * *" # dia 13, depois da publicação mensal do IHPC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/ingest/index.ts --monthly
      - name: Commit dados
        run: |
          git config user.name "bruto-bot"
          git config user.email "bot@bruto.local"
          git add data/
          git diff --staged --quiet || git commit -m "data: ingest mensal $(date +%Y-%m)"
          git push
