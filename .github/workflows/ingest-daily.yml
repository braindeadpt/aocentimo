name: ingest — diária

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/ingest/index.ts --daily
      - name: Commit dados
        run: |
          git config user.name "bruto-bot"
          git config user.email "bot@bruto.local"
          git add data/
          git diff --staged --quiet || git commit -m "data: ingest diária $(date +%Y-%m-%d)"
          git push
