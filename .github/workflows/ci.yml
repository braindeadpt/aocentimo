name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run derive
      - run: npm run validate:data
      - run: npm run build
      # o orçamento do HTML da home (≤80 KB gzip; o mapa fora do flight):
      # unitários (gate-html.test.ts) não correm sem build — o script é o
      # mesmo gate em linha, com a mensagem para quem quebrou
      - run: node scripts/_gate-html.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # o audit corre contra o out/ que o webServer do playwright já
      # construiu para o e2e: mesma ordem do deploy (servidor + auditorias)
      - run: node scripts/_serve-static.mjs &
      - run: sleep 1 && npm run audit
